name: Python CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Version
        run: python --version

      - name: Run Application
        run: python test.py

      - name: Install Pytest
        run: pip install pytest

      

      - name: Build Docker Image
        run: docker build -t my-python-app .